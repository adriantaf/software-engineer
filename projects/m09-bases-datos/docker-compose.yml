services:
  db:
    image: postgres:16-alpine
    container_name: m09-agenda-ops-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agenda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia_esto_en_local}
      POSTGRES_DB: ${POSTGRES_DB:-agenda_ops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agenda} -d ${POSTGRES_DB:-agenda_ops}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
