<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Atelier mark: ink tile + A formed as set-square / measuring rule -->
  <rect width="64" height="64" rx="14" fill="#0F172A"/>
  <!-- Set-square A -->
  <path
    stroke="#14B8A6"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M18 46 L32 16 L46 46"
  />
  <!-- Measuring crossbar (rule) -->
  <path
    stroke="#14B8A6"
    stroke-width="4.5"
    stroke-linecap="round"
    d="M24 36 H40"
  />
  <!-- Rule ticks -->
  <path
    stroke="#5EEAD4"
    stroke-width="1.75"
    stroke-linecap="round"
    opacity="0.85"
    d="M26.5 33.5 V38.5 M32 32.5 V39.5 M37.5 33.5 V38.5"
  />
  <!-- Bench ledge -->
  <path
    stroke="#14B8A6"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.45"
    d="M16 52 H48"
  />
</svg>
